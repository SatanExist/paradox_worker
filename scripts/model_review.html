<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Model review — studio card</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #0c0c0e;
      color: #eee;
    }
    #stage { width: 100vw; height: 100vh; }
    canvas { display: block; }
    #hud {
      position: fixed; top: 14px; left: 14px; right: 14px;
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      pointer-events: none;
    }
    #hud > * { pointer-events: auto; }
    button, select, label {
      padding: 7px 11px; background: rgba(22,22,26,.88);
      color: #eee; border: 1px solid #3a3a42; border-radius: 999px;
      cursor: pointer; font-size: 13px;
    }
    button:hover, select:hover { border-color: #c45; }
    #status { font-size: 12px; color: #9a9aa3; margin-left: 4px; }
    #drop {
      position: fixed; inset: 0; display: none; place-items: center;
      background: rgba(0,0,0,.45); color: #fff; font-size: 18px; z-index: 5;
    }
    #drop.on { display: grid; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="drop">Отпустите GLB</div>
  <div id="hud">
    <strong>Review</strong>
    <input id="pick" type="file" accept=".glb,.gltf" hidden />
    <button type="button" id="open">Open GLB</button>
    <select id="preset">
      <option value="../preview_textures/armor_t2_ultra_native_pbr_delight.glb">Knight — PBR + polish</option>
      <option value="../preview_textures/armor_t2_ultra_native_pbr_png.glb">Knight — native PBR PNG</option>
      <option value="../preview_textures/armor_t2_ultra_native_pbr.glb">Knight — native PBR WebP</option>
    </select>
    <button type="button" id="front">Front</button>
    <button type="button" id="side">Side</button>
    <button type="button" id="back">Back</button>
    <label><input type="checkbox" id="spin" checked /> Auto orbit</label>
    <label><input type="checkbox" id="env" checked /> IBL</label>
    <span id="status">…</span>
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.176.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const stage = document.getElementById('stage');
    const status = document.getElementById('status');
    const spinEl = document.getElementById('spin');
    const envEl = document.getElementById('env');
    const preset = document.getElementById('preset');
    const drop = document.getElementById('drop');

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    stage.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x101014);
    scene.fog = new THREE.Fog(0x101014, 8, 28);

    const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 80);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.1;

    const hemi = new THREE.HemisphereLight(0xe8f0ff, 0x1a120c, 0.35);
    scene.add(hemi);
    const key = new THREE.DirectionalLight(0xfff2dc, 2.2);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.bias = -0.00025;
    scene.add(key);
    const fill = new THREE.DirectionalLight(0x9ec5ff, 0.55);
    fill.position.set(-4, 2, 1);
    scene.add(fill);
    const rim = new THREE.DirectionalLight(0xff7a3d, 1.35);
    rim.position.set(-1.2, 2.4, -4);
    scene.add(rim);

    const pmrem = new THREE.PMREMGenerator(renderer);
    const envRT = pmrem.fromScene(new RoomEnvironment(), 0.04);
    scene.environment = envRT.texture;
    pmrem.dispose();
    scene.environmentIntensity = 1.2;

    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(6, 64),
      new THREE.MeshStandardMaterial({
        color: 0x151518,
        metalness: 0.85,
        roughness: 0.18,
      }),
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    let root = null;
    let framed = { center: new THREE.Vector3(), maxDim: 1 };
    let objectUrl = null;

    function resize() {
      const w = stage.clientWidth;
      const h = stage.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / Math.max(1, h);
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();

    function syncEnv() {
      scene.environmentIntensity = envEl.checked ? 1.2 : 0.0;
    }
    envEl.onchange = syncEnv;
    spinEl.onchange = () => { controls.autoRotate = spinEl.checked; };

    function setView(kind) {
      const { center, maxDim } = framed;
      const d = maxDim * 2.15;
      const y = center.y + maxDim * 0.12;
      if (kind === 'front') camera.position.set(center.x, y, center.z + d);
      else if (kind === 'side') camera.position.set(center.x + d, y, center.z);
      else camera.position.set(center.x, y, center.z - d);
      controls.target.copy(center);
      controls.update();
    }

    function frameObject(obj) {
      const box = new THREE.Box3().setFromObject(obj);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z, 0.001);
      framed = { center: center.clone(), maxDim };
      floor.position.set(center.x, box.min.y - 0.002, center.z);
      floor.scale.setScalar(Math.max(1.4, maxDim * 1.6));
      key.position.set(center.x + maxDim * 2.2, center.y + maxDim * 2.8, center.z + maxDim * 1.4);
      key.target.position.copy(center);
      key.target.updateMatrixWorld();
      const e = maxDim * 2.4;
      key.shadow.camera.near = maxDim / 40;
      key.shadow.camera.far = maxDim * 18;
      key.shadow.camera.left = -e;
      key.shadow.camera.right = e;
      key.shadow.camera.top = e;
      key.shadow.camera.bottom = -e;
      key.shadow.camera.updateProjectionMatrix();
      camera.near = maxDim / 120;
      camera.far = maxDim * 80;
      setView('front');
    }

    async function loadFromUrl(url, label) {
      status.textContent = 'Loading…';
      if (root) {
        scene.remove(root);
        root = null;
      }
      const loader = new GLTFLoader();
      try {
        const gltf = await loader.loadAsync(url);
        root = gltf.scene;
        let verts = 0;
        let tris = 0;
        root.traverse((c) => {
          if (!c.isMesh) return;
          c.castShadow = true;
          c.receiveShadow = true;
          const g = c.geometry;
          verts += g.attributes.position?.count || 0;
          tris += g.index ? g.index.count / 3 : verts / 3;
        });
        scene.add(root);
        frameObject(root);
        status.textContent = `${label} · ${Math.round(verts).toLocaleString()} v / ${Math.round(tris).toLocaleString()} t`;
      } catch (err) {
        status.textContent = err.message + ' · python -m http.server 8765 from repo root';
      }
    }

    function loadFile(file) {
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      objectUrl = URL.createObjectURL(file);
      loadFromUrl(objectUrl, file.name);
    }

    document.getElementById('open').onclick = () => document.getElementById('pick').click();
    document.getElementById('pick').onchange = (e) => {
      const f = e.target.files && e.target.files[0];
      if (f) loadFile(f);
    };
    document.getElementById('front').onclick = () => setView('front');
    document.getElementById('side').onclick = () => setView('side');
    document.getElementById('back').onclick = () => setView('back');
    preset.onchange = () => loadFromUrl(preset.value, preset.selectedOptions[0].text);

    window.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('on'); });
    window.addEventListener('dragleave', () => drop.classList.remove('on'));
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      drop.classList.remove('on');
      const f = e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) loadFile(f);
    });

    const q = new URLSearchParams(location.search).get('file');
    const initial = q
      ? (q.startsWith('../') || q.startsWith('http') ? q : `../${q.replace(/^\/+/, '')}`)
      : preset.value;
    loadFromUrl(initial, q || preset.selectedOptions[0].text);

    function tick() {
      requestAnimationFrame(tick);
      controls.update();
      renderer.render(scene, camera);
    }
    tick();
  </script>
</body>
</html>
