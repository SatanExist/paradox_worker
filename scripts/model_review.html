<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Model review — studio card</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #0c0c0e;
      color: #eee;
    }
    #stage { width: 100vw; height: 100vh; }
    #hud {
      position: fixed; top: 14px; left: 14px; right: 14px;
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      pointer-events: none;
    }
    #hud > * { pointer-events: auto; }
    button, select, label {
      padding: 7px 11px; background: rgba(22,22,26,.88);
      color: #eee; border: 1px solid #3a3a42; border-radius: 999px;
      cursor: pointer; font-size: 13px;
    }
    button:hover, select:hover { border-color: #c45; }
    #status { font-size: 12px; color: #9a9aa3; margin-left: 4px; }
    #drop {
      position: fixed; inset: 0; display: none; place-items: center;
      background: rgba(0,0,0,.45); color: #fff; font-size: 18px; z-index: 5;
    }
    #drop.on { display: grid; }
    a { color: #ff8aa8; font-size: 13px; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="drop">Отпустите GLB</div>
  <div id="hud">
    <strong>Review</strong>
    <a href="./studio_lab.html">Generate lab</a>
    <input id="pick" type="file" accept=".glb,.gltf" hidden />
    <button type="button" id="open">Open GLB</button>
    <select id="preset">
      <option value="../preview_textures/h0_armor_hi3dgen.glb">Hi3DGen H0 — knight clay (~7 MB)</option>
      <option value="../preview_textures/h0b_armor_slat12.glb">Hi3DGen H0b — slat12 (~7 MB)</option>
      <option value="../preview_textures/h0c_armor_flexicubes.glb">Hi3DGen H0c — FlexiCubes (~7 MB)</option>
      <option value="../preview_textures/h0d_armor_space.glb">Hi3DGen H0d — HF Space (~7 MB)</option>
      <option value="../preview_textures/h0e_armor_space_attrs.glb">Hi3DGen H0e — Space vertex_attrs (~7.4 MB)</option>
      <option value="../preview_textures/h0e_space_ex0.glb">Hi3DGen H0e — Space example 0 dragon (~27 MB)</option>
      <option value="../preview_textures/h0f_armor_bust.glb">Hi3DGen H0f — knight bust crop (~21 MB)</option>
      <option value="../preview_textures/armor_t2_v17_realistic.png.glb">Knight — Realistic 4K+polish (~97 MB)</option>
      <option value="../preview_textures/preset_high_armor.png.glb">Knight — High 2K+polish (~47 MB)</option>
      <option value="../preview_textures/preset_medium_chest.png.glb">Chest — Medium 2K+soft (~25 MB)</option>
      <option value="../preview_textures/preset_low_chest.png.glb">Chest — Low 1K (~12 MB)</option>
      <option value="../preview_textures/armor_t2_ultra_native_pbr_delight.glb">Knight — older local delight</option>
      <option value="../preview_textures/armor_t2_ultra_native_pbr_png.glb">Knight — native PBR PNG</option>
      <option value="../preview_textures/armor_t2_ultra_native_pbr.glb">Knight — native PBR WebP</option>
    </select>
    <button type="button" id="front">Front</button>
    <button type="button" id="side">Side</button>
    <button type="button" id="back">Back</button>
    <button type="button" id="modeStudio">Карточка</button>
    <button type="button" id="modeInspect">Стандарт</button>
    <select id="light" title="Освещение">
      <option value="studio">Свет: Studio</option>
      <option value="gallery">Свет: Gallery</option>
      <option value="outdoor">Свет: Outdoor</option>
      <option value="neon">Свет: Neon</option>
      <option value="night">Свет: Night</option>
    </select>
    <label><input type="checkbox" id="spin" checked /> Auto orbit</label>
    <label><input type="checkbox" id="env" checked /> IBL</label>
    <label><input type="checkbox" id="wire" /> Каркас</label>
    <label><input type="checkbox" id="albedo" /> Только albedo</label>
    <label><input type="checkbox" id="previewShade" /> Нормаль как Preview</label>
    <span id="status">…</span>
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.176.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import { createStudioViewer } from "./studio_viewer.js";

    const status = document.getElementById("status");
    const spinEl = document.getElementById("spin");
    const envEl = document.getElementById("env");
    const preset = document.getElementById("preset");
    const drop = document.getElementById("drop");

    const viewer = createStudioViewer(document.getElementById("stage"), {
      initialMode: "studio",
      onStatus: (msg) => { status.textContent = msg; },
    });

    document.getElementById("open").onclick = () => document.getElementById("pick").click();
    document.getElementById("pick").onchange = (e) => {
      const f = e.target.files && e.target.files[0];
      if (f) viewer.loadFile(f);
    };
    document.getElementById("front").onclick = () => viewer.setView("front");
    document.getElementById("side").onclick = () => viewer.setView("side");
    document.getElementById("back").onclick = () => viewer.setView("back");
    document.getElementById("modeStudio").onclick = () => {
      viewer.setMode("studio");
      spinEl.checked = true;
      viewer.setAutoOrbit(true);
    };
    document.getElementById("modeInspect").onclick = () => {
      viewer.setMode("inspect");
      spinEl.checked = false;
      viewer.setAutoOrbit(false);
    };
    spinEl.onchange = () => viewer.setAutoOrbit(spinEl.checked);
    envEl.onchange = () => viewer.setIbl(envEl.checked);
    document.getElementById("light").onchange = (e) => viewer.setLightRig(e.target.value);
    document.getElementById("wire").onchange = (e) => viewer.setWireframe(e.target.checked);
    document.getElementById("albedo").onchange = (e) => viewer.setAlbedoOnly(e.target.checked);
    document.getElementById("previewShade").onchange = (e) => viewer.setPreviewShade(e.target.checked);
    const LAB = "http://127.0.0.1:8787";
    const LOCAL_FALLBACK = "../preview_textures/h0_armor_hi3dgen.glb";
    const LOCAL_FALLBACK_LABEL = "Hi3DGen H0 — knight clay (~7 MB)";

    function decodeFileParam(raw) {
      if (!raw) return null;
      let v = raw.trim();
      if (v.startsWith("file=")) v = v.slice(5);
      try {
        if (v.includes("%")) v = decodeURIComponent(v);
      } catch {
        /* keep the raw value */
      }
      return v;
    }

    function readFileQuery() {
      const params = new URLSearchParams(location.search);
      const direct = decodeFileParam(params.get("file"));
      if (direct) return direct;
      const raw = location.search.replace(/^\?/, "");
      if (!raw) return null;
      let decoded = raw;
      try {
        decoded = decodeURIComponent(raw);
      } catch {
        /* keep */
      }
      if (decoded.startsWith("file=")) return decodeFileParam(decoded.slice(5));
      return null;
    }

    function toViewerUrl(q) {
      if (!q) return preset.value;
      if (q.startsWith("../") || q.startsWith("http://") || q.startsWith("https://")) return q;
      if (q.startsWith("/")) return `..${q}`;
      return `../${q.replace(/^\/+/, "")}`;
    }

    function resolveGlbUrl(url) {
      if (!url) return url;
      if (url.startsWith("https://")) {
        return `${LAB}/api/proxy-glb?url=${encodeURIComponent(url)}`;
      }
      return url;
    }

    async function loadModel(url, label) {
      try {
        await viewer.loadFromUrl(resolveGlbUrl(url), label);
        return true;
      } catch (err) {
        const msg = err && err.message ? err.message : String(err);
        status.textContent = `${msg} — локальный H0`;
        if (url === LOCAL_FALLBACK || resolveGlbUrl(url) === LOCAL_FALLBACK) return false;
        try {
          await viewer.loadFromUrl(LOCAL_FALLBACK, LOCAL_FALLBACK_LABEL);
        } catch (err2) {
          status.textContent = err2 && err2.message ? err2.message : String(err2);
        }
        return false;
      }
    }

    preset.onchange = () => {
      loadModel(preset.value, preset.selectedOptions[0].text);
    };

    window.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("on"); });
    window.addEventListener("dragleave", () => drop.classList.remove("on"));
    window.addEventListener("drop", (e) => {
      e.preventDefault();
      drop.classList.remove("on");
      const f = e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) viewer.loadFile(f);
    });

    async function loadShelf() {
      const ac = new AbortController();
      const timer = setTimeout(() => ac.abort(), 3000);
      try {
        const res = await fetch(`${LAB}/api/lab/workspace`, { signal: ac.signal });
        if (!res.ok) return;
        const data = await res.json();
        if (!data.models || !data.models.length) return;
        const current = preset.value;
        preset.innerHTML = "";
        for (const m of data.models) {
          const opt = document.createElement("option");
          opt.value = m.url.startsWith("/") ? `..${m.url}` : m.url;
          const mb = m.bytes ? ` (~${(m.bytes / (1024 * 1024)).toFixed(0)} MB)` : "";
          opt.textContent = `${m.label}${mb}`;
          preset.appendChild(opt);
        }
        const match = [...preset.options].find((o) => o.value === current || o.value.endsWith(current.replace("../", "/")));
        if (match) preset.value = match.value;
      } catch {
        /* keep hardcoded options when lab API is down */
      } finally {
        clearTimeout(timer);
      }
    }

    async function boot() {
      const q = readFileQuery();
      const initial = toViewerUrl(q);
      const label = q || preset.selectedOptions[0].text;
      const shelfP = loadShelf();
      if (initial.startsWith("https://")) {
        status.textContent = "R2 GLB: сначала локальный H0, затем proxy…";
        await loadModel(LOCAL_FALLBACK, LOCAL_FALLBACK_LABEL);
        try {
          await viewer.loadFromUrl(resolveGlbUrl(initial), q);
        } catch {
          status.textContent = "R2/proxy недоступен — локальный H0. Скачайте GLB в браузере и Open GLB.";
        }
      } else {
        await loadModel(initial, label);
      }
      await shelfP;
    }
    boot();
  </script>
</body>
</html>
