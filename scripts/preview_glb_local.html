<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>paradox_worker — local GLB preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { font-family: system-ui, sans-serif; background: #1a1a1a; color: #eee; }
    #bar {
      padding: 10px 14px; background: #2a2a2a; border-bottom: 1px solid #444;
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    }
    #bar a { color: #f88; }
    #bar select, #bar button { padding: 6px 10px; background: #333; color: #eee; border: 1px solid #555; border-radius: 4px; cursor: pointer; }
    #status { font-size: 13px; color: #aaa; flex: 1; min-width: 200px; }
    #canvas-wrap { width: 100vw; height: calc(100vh - 52px); }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="bar">
    <strong>GLB preview</strong>
    <select id="file">
      <option value="../model-armor-clay-sampler50-pro-gi01-rt6-e800.glb">rt6+e800 — denser 800k</option>
      <option value="../model-armor-clay-sampler50-pro-gi01-rt6.glb">rt6 — gi01 + rescale_t 6/6 (BEST)</option>
      <option value="../model-armor-clay-sampler50-pro-gi01-hole01.glb">шаг5 — gi01 + hole perimeter 0.1</option>
      <option value="../model-armor-clay-sampler50-pro-gi01-band2.glb">шаг4 — gi01 + remesh_band 2 (≈same)</option>
      <option value="../model-armor-clay-sampler50-pro-gi01-sg10.glb">шаг3 — gi01 + shape guidance 10 (≈same)</option>
      <option value="../model-armor-clay-sampler50-pro-gi01-s75.glb">шаг2 — gi01 + steps75 (хуже/неясно)</option>
      <option value="../model-armor-clay-sampler50-pro-gi01.glb">шаг1 — guidance_interval 0–1 (BEST)</option>
      <option value="../model-armor-clay-sampler50-pro-1536-tok98k.glb">tokens 98k — best + max_num_tokens</option>
      <option value="../model-armor-clay-sampler50-pro-1536-e700.glb">C+E — 1536 + remesh + 700k</option>
      <option value="../model-armor-clay-sampler50-pro-1536.glb">C@D' — 1536 + remesh + 500k</option>
      <option value="../model-armor-clay-sampler50-pro-e700.glb">E lite — D' + decim 700k</option>
      <option value="../model-armor-clay-sampler50-pro-rp05.glb">F@D' — sampler50-pro + project0.5</option>
      <option value="../model-armor-clay-sampler50-pro42.glb">D' — sampler50 + RGB (без cutout)</option>
      <option value="../model-armor-clay-maxq-remesh42.glb">G+F — maxq + remesh + project0.9</option>
      <option value="../model-armor-clay-maxq-pro42.glb">G stress — maxq 1536+sampler (нормальные пропорции)</option>
      <option value="../model-armor-clay-sampler50-42.glb">Ось D — sampler50 seed42</option>
      <option value="../model-armor-clay-seed42.glb">Track A — clay seed42 (winner)</option>
      <option value="../model-armor-clay_repaired.glb">Track A — seed42 REPAIRED</option>
      <option value="../model-armor-clay-nopreprocess42.glb">A/B — cutout + no-preprocess</option>
      <option value="../model-armor-clay-noremesh42.glb">A/B — no-remesh 700k</option>
      <option value="../model-armor-clay-1536-42.glb">A/B — 1536_cascade 700k</option>
      <option value="../model-armor-clay-seed1.glb">Track A — clay seed1</option>
      <option value="../model-armor-clay-seed7.glb">Track A — clay seed7</option>
      <option value="../model-armor-clay-seed123.glb">Track A — clay seed123</option>
      <option value="../knight_w2c_shaded.glb">MV-Adapter — knight_w2c (80k)</option>
      <option value="../knight_fast_shaded.glb">MV-Adapter — knight_fast</option>
      <option value="../knight_i2tex_shaded.glb">MV-Adapter — knight_i2tex</option>
      <option value="../model-armor-wow.glb">Armor cascade textured</option>
      <option value="../model-wow-baseline.glb">W1 cascade textured chest</option>
      <option value="../model-tex-matte.glb">v1 paint matte</option>
      <option value="../model-tex.glb">v1 paint original</option>
      <option value="../model-t2-chest-seed7.glb">v0 bake T2 chest seed7</option>
      <option value="../model-t2-chest-seed1.glb">v0 bake T2 chest seed1</option>
      <option value="../model-clay.glb">clay</option>
    </select>
    <button id="reload">Reload</button>
    <button type="button" id="viewFront" title="Front">Front</button>
    <button type="button" id="viewSide" title="Right side">Side</button>
    <button type="button" id="viewBack" title="Back">Back</button>
    <label><input type="checkbox" id="wireframe" /> Wireframe</label>
    <label><input type="checkbox" id="fixMat" checked /> Fix metallic (Blender-like)</label>
    <label>Key <input type="range" id="keyLight" min="0" max="40" value="18" style="width:90px;vertical-align:middle" /></label>
    <label><input type="checkbox" id="envLight" checked /> Env light</label>
    <span id="status">Loading…</span>
  </div>
  <div id="canvas-wrap"></div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.176.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const wrap = document.getElementById('canvas-wrap');
    const status = document.getElementById('status');
    const fileSel = document.getElementById('file');
    const fixMat = document.getElementById('fixMat');
    const wireframe = document.getElementById('wireframe');
    const keyLightEl = document.getElementById('keyLight');
    const envLightEl = document.getElementById('envLight');

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    wrap.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x2a2a2a);
    const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 100);
    camera.position.set(1.5, 1, 1.5);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Studio lighting: ambient + key / fill / rim (directional)
    const hemi = new THREE.HemisphereLight(0xffffff, 0x444455, 0.55);
    scene.add(hemi);

    const key = new THREE.DirectionalLight(0xfff5e6, 1.8);
    key.position.set(3.5, 5, 2.5);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.bias = -0.0002;
    scene.add(key);

    const fill = new THREE.DirectionalLight(0xddeeff, 0.7);
    fill.position.set(-3, 2, 1);
    scene.add(fill);

    const rim = new THREE.DirectionalLight(0xffffff, 0.9);
    rim.position.set(-1.5, 3, -4);
    scene.add(rim);

    // Soft IBL so metal/gold reads correctly
    const pmrem = new THREE.PMREMGenerator(renderer);
    const envRT = pmrem.fromScene(new RoomEnvironment(), 0.04);
    scene.environment = envRT.texture;
    pmrem.dispose();

    function syncLights() {
      const k = Number(keyLightEl.value) / 10;
      key.intensity = k;
      fill.intensity = Math.max(0.15, k * 0.35);
      rim.intensity = Math.max(0.2, k * 0.45);
      hemi.intensity = 0.35 + k * 0.12;
      scene.environmentIntensity = envLightEl.checked ? 0.85 : 0.0;
      // three r152+ uses environmentIntensity; older falls back via env map null
      if (!('environmentIntensity' in scene)) {
        scene.environment = envLightEl.checked ? envRT.texture : null;
      }
    }
    syncLights();
    keyLightEl.oninput = syncLights;
    envLightEl.onchange = syncLights;

    const grid = new THREE.GridHelper(2, 20, 0x444444, 0x333333);
    scene.add(grid);

    let root = null;

    function resize() {
      const w = wrap.clientWidth, h = wrap.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();

    function applyFixes(obj) {
      obj.traverse((child) => {
        if (!child.isMesh) return;
        child.castShadow = true;
        child.receiveShadow = true;
        child.material = child.material.clone();
        child.material.wireframe = wireframe.checked;
        if (fixMat.checked && child.material.metalness !== undefined) {
          child.material.metalness = 0.0;
          child.material.roughness = 0.85;
        }
        child.material.needsUpdate = true;
      });
    }

    let framed = { center: new THREE.Vector3(), maxDim: 1 };

    function setOrbitView(kind) {
      const { center, maxDim } = framed;
      const d = maxDim * 1.85;
      const y = center.y + maxDim * 0.15;
      if (kind === 'front') camera.position.set(center.x, y, center.z + d);
      else if (kind === 'side') camera.position.set(center.x + d, y, center.z);
      else if (kind === 'back') camera.position.set(center.x, y, center.z - d);
      else camera.position.copy(center).add(new THREE.Vector3(maxDim * 1.2, maxDim * 0.9, maxDim * 1.2));
      controls.target.copy(center);
      controls.update();
      camera.updateProjectionMatrix();
    }
    window.__setOrbitView = setOrbitView;

    function frameObject(obj) {
      const box = new THREE.Box3().setFromObject(obj);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z, 0.001);
      framed = { center: center.clone(), maxDim };
      controls.target.copy(center);
      camera.position.copy(center).add(new THREE.Vector3(maxDim * 1.2, maxDim * 0.9, maxDim * 1.2));
      camera.near = maxDim / 100;
      camera.far = maxDim * 100;
      camera.updateProjectionMatrix();
      // Keep key light relative to framed model
      key.position.set(center.x + maxDim * 2, center.y + maxDim * 2.5, center.z + maxDim * 1.5);
      key.target.position.copy(center);
      key.target.updateMatrixWorld();
      key.shadow.camera.near = maxDim / 50;
      key.shadow.camera.far = maxDim * 20;
      const extent = maxDim * 2.5;
      key.shadow.camera.left = -extent;
      key.shadow.camera.right = extent;
      key.shadow.camera.top = extent;
      key.shadow.camera.bottom = -extent;
      key.shadow.camera.updateProjectionMatrix();
      grid.position.y = box.min.y;
      grid.scale.setScalar(Math.max(1, maxDim));
    }

    async function load(name) {
      status.textContent = `Loading ${name}…`;
      if (root) { scene.remove(root); root = null; }
      const loader = new GLTFLoader();
      try {
        const gltf = await loader.loadAsync(name);
        root = gltf.scene;
        applyFixes(root);
        scene.add(root);
        frameObject(root);
        let verts = 0, tris = 0;
        root.traverse((c) => {
          if (c.isMesh && c.geometry) {
            const g = c.geometry;
            verts += g.attributes.position?.count || 0;
            tris += g.index ? g.index.count / 3 : verts / 3;
          }
        });
        status.textContent = `${name} OK — ~${Math.round(verts).toLocaleString()} verts, ~${Math.round(tris).toLocaleString()} tris`;
      } catch (e) {
        status.textContent = `Error: ${e.message}. Run: python -m http.server 8765 from repo root.`;
        console.error(e);
      }
    }

    document.getElementById('reload').onclick = () => load(fileSel.value);
    document.getElementById('viewFront').onclick = () => setOrbitView('front');
    document.getElementById('viewSide').onclick = () => setOrbitView('side');
    document.getElementById('viewBack').onclick = () => setOrbitView('back');
    fileSel.onchange = () => load(fileSel.value);
    wireframe.onchange = () => { if (root) applyFixes(root); };
    fixMat.onchange = () => { if (root) applyFixes(root); };

    const params = new URLSearchParams(location.search);
    const q = params.get('file');
    let initial = fileSel.value;
    if (q) {
      const path = q.startsWith('../') ? q : `../${q.replace(/^\/+/, '')}`;
      const match = [...fileSel.options].some((o) => o.value === path);
      if (!match) {
        const opt = document.createElement('option');
        opt.value = path;
        opt.textContent = `URL — ${q}`;
        fileSel.insertBefore(opt, fileSel.firstChild);
      }
      fileSel.value = path;
      initial = path;
    }
    if (params.get('wireframe') === '1') wireframe.checked = true;
    load(initial);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
