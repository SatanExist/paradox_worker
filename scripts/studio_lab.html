<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Studio lab — generate + review</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #140c10;
      color: #f3e8ea;
      display: grid;
      grid-template-columns: minmax(280px, 360px) 1fr;
      min-height: 100%;
    }
    aside {
      border-right: 1px solid #3a2430;
      background: #1a1014;
      padding: 16px;
      overflow: auto;
    }
    h1 { font-size: 16px; font-weight: 650; margin-bottom: 4px; }
    .muted { color: #b79aa3; font-size: 12px; line-height: 1.45; }
    .block { margin-top: 16px; }
    label.slot, .preset {
      display: block; margin: 8px 0; font-size: 13px;
    }
    input[type="url"], input[type="text"] {
      width: 100%; margin-top: 4px; padding: 8px 10px;
      border-radius: 10px; border: 1px solid #4a3038;
      background: #24141a; color: #f3e8ea;
    }
    .presets { display: grid; gap: 6px; }
    .preset {
      border: 1px solid #4a3038; border-radius: 12px; padding: 8px 10px;
      cursor: pointer; background: #221218;
    }
    .preset:has(input:checked) { border-color: #e06; background: #2c151c; }
    .preset small { display: block; color: #b79aa3; font-size: 11px; margin-top: 2px; }
    button {
      border: 0; border-radius: 999px; padding: 9px 14px; cursor: pointer;
      font-size: 13px; background: #e06; color: #fff;
    }
    button.ghost {
      background: transparent; color: #f3e8ea; border: 1px solid #4a3038;
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    main { display: grid; grid-template-rows: auto 1fr auto; min-width: 0; }
    #toolbar {
      display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
      padding: 10px 12px; border-bottom: 1px solid #3a2430;
    }
    #toolbar button, #toolbar label, #toolbar select {
      background: #24141a; color: #f3e8ea; border: 1px solid #4a3038;
      border-radius: 999px; padding: 6px 11px; font-size: 12px;
    }
    #stageWrap { min-height: 0; position: relative; }
    #stage { position: absolute; inset: 0; }
    #status {
      padding: 8px 12px; font-size: 12px; color: #b79aa3;
      border-top: 1px solid #3a2430;
    }
    #drop {
      position: absolute; inset: 0; display: none; place-items: center;
      background: rgba(20, 8, 12, .55); z-index: 4; font-size: 18px;
    }
    #drop.on { display: grid; }
    a { color: #ff8aa8; }
  </style>
</head>
<body>
  <aside>
    <h1>Generate</h1>
    <p class="muted" id="underFront">3D с одной картинки. Перед ближе к фото; бок и зад модель достраивает сама.</p>

    <div class="block">
      <div class="muted">Качество</div>
      <div class="presets" id="presets"></div>
    </div>

    <div class="block">
      <label class="slot">Front *
        <input id="front" type="url" placeholder="https://… публичный URL картинки" />
      </label>
      <button type="button" class="ghost" id="toggleExtra">+ Добавить ракурсы</button>
      <div id="extra" hidden>
        <p class="muted" id="underExtra" style="margin: 8px 0;">Реальные фото того же предмета.</p>
        <label class="slot">Side <input id="side" type="url" /></label>
        <label class="slot">Back <input id="back" type="url" /></label>
        <label class="slot">Extra <input id="extraUrl" type="url" /></label>
      </div>
    </div>

    <div class="block row">
      <button type="button" id="generate">Сгенерировать</button>
      <button type="button" class="ghost" id="demo">Демо: рыцарь</button>
    </div>
    <p class="muted" id="apiHint">Живая генерация жжёт GPU. Демо грузит локальный GLB без RunPod.</p>
    <p class="muted" id="jobLine"></p>
  </aside>

  <main>
    <div id="toolbar">
      <strong>Осмотр</strong>
      <button type="button" id="modeStudio">Карточка</button>
      <button type="button" id="modeInspect">Стандарт</button>
      <button type="button" data-view="front">Front</button>
      <button type="button" data-view="side">Side</button>
      <button type="button" data-view="back">Back</button>
      <label><input type="checkbox" id="spin" checked /> Орбита</label>
      <select id="light" title="Освещение">
        <option value="studio">Studio</option>
        <option value="gallery">Gallery</option>
        <option value="outdoor">Outdoor</option>
        <option value="neon">Neon</option>
        <option value="night">Night</option>
      </select>
      <label><input type="checkbox" id="env" checked /> IBL</label>
      <label><input type="checkbox" id="wire" /> Каркас</label>
      <label><input type="checkbox" id="albedo" /> Только albedo</label>
      <input id="pick" type="file" accept=".glb,.gltf" hidden />
      <button type="button" id="openGlb">Открыть GLB</button>
    </div>
    <div id="stageWrap">
      <div id="stage"></div>
      <div id="drop">Отпустите GLB</div>
    </div>
    <div id="status">…</div>
  </main>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.176.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import { createStudioViewer } from "./studio_viewer.js";

    const FALLBACK_PRESETS = [
      { id: "low", label: "Low", blurb: "Превью силуэта", default: false, etaSecondsWarm: 45 },
      { id: "medium", label: "Medium", blurb: "Стандарт для предметов", default: true, etaSecondsWarm: 240 },
      { id: "high", label: "High", blurb: "Лучший фронт персонажа", default: false, etaSecondsWarm: 300 },
      { id: "realistic", label: "Realistic", blurb: "Максимум T2, 4K PBR", default: false, etaSecondsWarm: 360 },
    ];
    const DEMO_GLB = "/preview_textures/armor_t2_v17_realistic.png.glb";
    const apiBase = location.port === "8787" ? "" : "http://127.0.0.1:8787";

    const statusEl = document.getElementById("status");
    const presetsEl = document.getElementById("presets");
    const extraBox = document.getElementById("extra");
    const jobLine = document.getElementById("jobLine");
    const apiHint = document.getElementById("apiHint");
    const drop = document.getElementById("drop");

    const viewer = createStudioViewer(document.getElementById("stage"), {
      initialMode: "studio",
      onStatus: (msg) => { statusEl.textContent = msg; },
    });

    let copy = null;
    let pollTimer = null;

    function selectedTier() {
      const el = presetsEl.querySelector("input[name=tier]:checked");
      return el ? el.value : "medium";
    }

    function renderPresets(list) {
      presetsEl.innerHTML = "";
      for (const p of list) {
        const wrap = document.createElement("label");
        wrap.className = "preset";
        wrap.innerHTML = `<input type="radio" name="tier" value="${p.id}" ${p.default ? "checked" : ""} />
          <b>${p.label}</b>
          <small>${p.blurb || ""} · warm ~${Math.round((p.etaSecondsWarm || 0) / 60)} мин</small>`;
        presetsEl.appendChild(wrap);
      }
    }

    async function loadCopy() {
      try {
        const res = await fetch(`${apiBase}/api/product-copy`);
        if (!res.ok) throw new Error(String(res.status));
        copy = await res.json();
        document.getElementById("underFront").textContent = copy.underFront;
        document.getElementById("underExtra").textContent = copy.underExtraViews;
        renderPresets(copy.qualityPresets);
        apiHint.textContent = "Bridge на :8787. Generate = живой RunPod. IBL обязателен для металла.";
      } catch {
        renderPresets(FALLBACK_PRESETS);
        apiHint.textContent = "Bridge не отвечает. Демо и осмотр GLB работают; Generate нужен py -3 scripts/studio_api.py";
      }
    }

    function slotPayload() {
      const front = document.getElementById("front").value.trim();
      if (!front) throw new Error("Нужен публичный https URL в Front");
      const slots = { front };
      const side = document.getElementById("side").value.trim();
      const back = document.getElementById("back").value.trim();
      const extra = document.getElementById("extraUrl").value.trim();
      if (side) slots.side = side;
      if (back) slots.back = back;
      if (extra) slots.extra = extra;
      return slots;
    }

    function glbUrl(url) {
      if (!url) return url;
      if (url.startsWith("/") || url.startsWith("blob:")) return url;
      if (apiBase === "" && url.startsWith("https://")) {
        return `/api/proxy-glb?url=${encodeURIComponent(url)}`;
      }
      return url;
    }

    async function pollJob(jobId, tier) {
      jobLine.textContent = `Job ${jobId}…`;
      const tick = async () => {
        const res = await fetch(`${apiBase}/api/jobs/${encodeURIComponent(jobId)}?tier=${encodeURIComponent(tier)}`);
        const data = await res.json();
        jobLine.textContent = `${data.status || "?"} · ${data.statusLine || jobId}`;
        if (data.status === "ready" && data.modelUrl) {
          await viewer.loadFromUrl(glbUrl(data.modelUrl), data.modelUrl);
          return;
        }
        if (data.status === "failed") {
          statusEl.textContent = data.error || "job failed";
          return;
        }
        pollTimer = setTimeout(tick, 5000);
      };
      tick();
    }

    document.getElementById("toggleExtra").onclick = () => {
      extraBox.hidden = !extraBox.hidden;
    };
    document.getElementById("modeStudio").onclick = () => {
      viewer.setMode("studio");
      document.getElementById("spin").checked = true;
      viewer.setAutoOrbit(true);
    };
    document.getElementById("modeInspect").onclick = () => {
      viewer.setMode("inspect");
      document.getElementById("spin").checked = false;
      viewer.setAutoOrbit(false);
    };
    document.querySelectorAll("[data-view]").forEach((btn) => {
      btn.onclick = () => viewer.setView(btn.dataset.view);
    });
    document.getElementById("spin").onchange = (e) => viewer.setAutoOrbit(e.target.checked);
    document.getElementById("env").onchange = (e) => viewer.setIbl(e.target.checked);
    document.getElementById("light").onchange = (e) => viewer.setLightRig(e.target.value);
    document.getElementById("wire").onchange = (e) => viewer.setWireframe(e.target.checked);
    document.getElementById("albedo").onchange = (e) => viewer.setAlbedoOnly(e.target.checked);
    document.getElementById("openGlb").onclick = () => document.getElementById("pick").click();
    document.getElementById("pick").onchange = (e) => {
      const f = e.target.files && e.target.files[0];
      if (f) viewer.loadFile(f);
    };
    document.getElementById("demo").onclick = () => {
      viewer.loadFromUrl(DEMO_GLB, "Knight polish").catch(() => {
        viewer.loadFromUrl("../preview_textures/armor_t2_ultra_native_pbr_delight.glb", "Knight polish");
      });
    };
    document.getElementById("generate").onclick = async () => {
      let slots;
      try { slots = slotPayload(); }
      catch (err) { jobLine.textContent = err.message; return; }
      const tier = selectedTier();
      if (!confirm(`Отправить ${tier} job на GPU? Это минуты и деньги.`)) return;
      document.getElementById("generate").disabled = true;
      try {
        const res = await fetch(`${apiBase}/api/jobs`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ mode: "image", tier, viewSlots: slots }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || res.statusText);
        jobLine.textContent = `${data.statusLine || ""} · ETA warm ~${data.etaSecondsWarm}s`;
        if (pollTimer) clearTimeout(pollTimer);
        pollJob(data.jobId, data.tier || tier);
      } catch (err) {
        jobLine.textContent = err.message;
      } finally {
        document.getElementById("generate").disabled = false;
      }
    };

    window.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("on"); });
    window.addEventListener("dragleave", () => drop.classList.remove("on"));
    window.addEventListener("drop", (e) => {
      e.preventDefault();
      drop.classList.remove("on");
      const f = e.dataTransfer.files && e.dataTransfer.files[0];
      if (f && /\.glb|\.gltf/i.test(f.name)) viewer.loadFile(f);
    });

    loadCopy();
    viewer.loadFromUrl(DEMO_GLB, "Knight polish").catch(() => {
      statusEl.textContent = "Нет демо-GLB. Откройте файл или запустите studio_api.py из корня репо.";
    });
  </script>
</body>
</html>
