name: Build ReconViaGen Docker Image

on:
  push:
    branches: [main, feat/trellis2-poc]
    paths:
      - "Dockerfile.reconviagen"
      - "worker_reconviagen.py"
      - "scripts/reconviagen_infer.py"
      - "docker/smoke_reconviagen_imports.py"
      - ".github/workflows/build-reconviagen.yml"
  workflow_dispatch:

jobs:
  build-reconviagen:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell \
            /usr/share/swift /usr/local/.ghcup || true
          sudo docker system prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push ReconViaGen image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.reconviagen
          push: true
          build-args: |
            PARADOX_BUILD_SHA=${{ github.sha }}
          tags: |
            ghcr.io/satanexist/paradox_worker:reconviagen-latest
            ghcr.io/satanexist/paradox_worker:reconviagen-sha-${{ steps.meta.outputs.short_sha }}
