name: Build Direct3D-S2 Docker Image

on:
  push:
    branches: [main, feat/trellis2-poc]
    paths:
      - "Dockerfile.direct3ds2"
      - "worker_direct3ds2.py"
      - "docker/smoke_direct3ds2_imports.py"
      - ".github/workflows/build-direct3ds2.yml"
  workflow_dispatch:
    inputs:
      smoke_fatal:
        description: "Fail the build when the import smoke fails (0 = push anyway)"
        default: "1"

jobs:
  build-direct3ds2:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules || true
          sudo docker system prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push Direct3D-S2 image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.direct3ds2
          push: true
          provenance: false
          cache-from: type=registry,ref=ghcr.io/satanexist/paradox_worker:direct3ds2-buildcache
          cache-to: type=registry,ref=ghcr.io/satanexist/paradox_worker:direct3ds2-buildcache,mode=min
          build-args: |
            PARADOX_BUILD_SHA=${{ github.sha }}
            SMOKE_FATAL=${{ github.event.inputs.smoke_fatal || '1' }}
          tags: |
            ghcr.io/satanexist/paradox_worker:direct3ds2-latest
            ghcr.io/satanexist/paradox_worker:direct3ds2-sha-${{ steps.meta.outputs.short_sha }}
