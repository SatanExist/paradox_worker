name: Build Hi3DGen Docker Image

on:
  push:
    branches: [main, feat/trellis2-poc]
    paths:
      - "Dockerfile.hi3dgen"
      - "worker_hi3dgen.py"
      - "scripts/hi3dgen_h0_infer.py"
      - "docker/smoke_hi3dgen_imports.py"
      - ".github/workflows/build-hi3dgen.yml"
  workflow_dispatch:

jobs:
  build-hi3dgen:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules || true
          sudo docker system prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push Hi3DGen image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.hi3dgen
          push: true
          provenance: false
          build-args: |
            PARADOX_BUILD_SHA=${{ github.sha }}
          tags: |
            ghcr.io/satanexist/paradox_worker:hi3dgen-latest
            ghcr.io/satanexist/paradox_worker:hi3dgen-sha-${{ steps.meta.outputs.short_sha }}
