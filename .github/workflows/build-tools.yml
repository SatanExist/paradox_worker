name: Build Tools Docker Image

on:
  push:
    branches: [main, feat/trellis2-poc]
    paths:
      - "Dockerfile.tools"
      - "worker_tools.py"
      - "studio_bridge/tools_ops.py"
      - "studio_bridge/print_remesh.py"
      - "studio_bridge/print_solid.py"
      - "studio_bridge/mesh_repair.py"
      - "studio_bridge/r2_public.py"
      - "tools_node/package.json"
      - "tools_node/package-lock.json"
      - "tools_node/decode.mjs"
      - "tools_node/game.mjs"
      - ".github/workflows/build-tools.yml"
  workflow_dispatch:

jobs:
  build-tools:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules || true
          sudo docker system prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push tools image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.tools
          push: true
          provenance: false
          build-args: |
            PARADOX_BUILD_SHA=${{ github.sha }}
          tags: |
            ghcr.io/satanexist/paradox_worker:tools-latest
            ghcr.io/satanexist/paradox_worker:tools-sha-${{ steps.meta.outputs.short_sha }}
