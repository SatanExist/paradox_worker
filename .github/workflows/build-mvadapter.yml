name: Build MV-Adapter Texture Docker Image

on:
  push:
    branches: [main, feat/trellis2-poc]
    paths:
      - "Dockerfile.mvadapter"
      - "worker_mvadapter.py"
      - "docker/smoke_mvadapter_imports.py"
      - "docker/mvadapter_texture_reqs.txt"
      - "docker/patch_open3d_headless.py"
      - ".github/workflows/build-mvadapter.yml"
  workflow_dispatch:

jobs:
  build-mvadapter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          echo "Before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup \
            /usr/lib/jvm || true
          docker system prune -af || true
          sudo apt-get clean || true
          echo "After cleanup:"
          df -h

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push MV-Adapter image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.mvadapter
          push: true
          provenance: false
          sbom: false
          build-args: |
            BUILD_SHA=${{ github.sha }}
          tags: |
            ghcr.io/satanexist/paradox_worker:mvadapter-latest
            ghcr.io/satanexist/paradox_worker:mvadapter-sha-${{ steps.meta.outputs.short_sha }}
