name: Build Rig Docker Image

# GPU worker for auto_rig (Dockerfile.rig). Also built from feat/game-prep-v2 so the image is checked before the
# branch is merged; the RunPod endpoint takes a tag by hand (rig-sha-<short>), nothing deploys by itself.
on:
  push:
    branches: [main, feat/game-prep-v2]
    paths:
      - "Dockerfile.rig"
      - "docker/skintokens_sdpa.patch"
      - "docker/smoke_rig_imports.py"
      - "docker/flash_attn_sdpa/**"
      - "worker_tools.py"
      - "studio_bridge/tools_ops.py"
      - "studio_bridge/mesh_repair.py"
      - "studio_bridge/r2_public.py"
      - "tools_rig/**"
      - "tools_node/package.json"
      - "tools_node/package-lock.json"
      - "tools_node/decode.mjs"
      - ".github/workflows/build-rig.yml"
  workflow_dispatch:

jobs:
  build-rig:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules || true
          sudo docker system prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push rig image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.rig
          push: true
          provenance: false
          build-args: |
            PARADOX_BUILD_SHA=${{ github.sha }}
          tags: |
            ghcr.io/satanexist/paradox_worker:rig-sha-${{ steps.meta.outputs.short_sha }}
