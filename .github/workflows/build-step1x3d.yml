name: Build Step1X-3D Docker Image

on:
  push:
    branches: [main, feat/trellis2-poc]
    paths:
      - "Dockerfile.step1x3d"
      - "worker_step1x3d.py"
      - "docker/smoke_step1x3d_imports.py"
      - ".github/workflows/build-step1x3d.yml"
  workflow_dispatch:
    inputs:
      smoke_fatal:
        description: "Fail the build when the import smoke fails (0 = push anyway)"
        default: "1"

jobs:
  build-step1x3d:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules || true
          sudo docker system prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push Step1X-3D image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.step1x3d
          push: true
          provenance: false
          cache-from: type=registry,ref=ghcr.io/satanexist/paradox_worker:step1x3d-buildcache
          cache-to: type=registry,ref=ghcr.io/satanexist/paradox_worker:step1x3d-buildcache,mode=min
          build-args: |
            PARADOX_BUILD_SHA=${{ github.sha }}
            SMOKE_FATAL=${{ github.event.inputs.smoke_fatal || '1' }}
          tags: |
            ghcr.io/satanexist/paradox_worker:step1x3d-latest
            ghcr.io/satanexist/paradox_worker:step1x3d-sha-${{ steps.meta.outputs.short_sha }}
